id: megabrain-teams
name: MegaBrain Teams
description: Manage MegaBrain team members, roles, and project permissions programmatically.
author: MegaBrain
url: https://getmegabrain.com/docs
category: business
prerequisites:
  - MegaBrain account with admin access
content:
  - name: stdio (npx)
    prerequisites:
      - Node.js
      - MegaBrain admin API key
    content: |
      {
        "command": "npx",
        "args": ["-y", "@megabrain/mcp-teams"],
        "env": {
          "MEGABRAIN_ADMIN_API_KEY": "{{MEGABRAIN_ADMIN_API_KEY}}"
        }
      }
parameters:
  - name: MegaBrain Admin API Key
    key: MEGABRAIN_ADMIN_API_KEY
    placeholder: mb_admin_xxxxxxxxxxxxxxxxxxxxxxxx
