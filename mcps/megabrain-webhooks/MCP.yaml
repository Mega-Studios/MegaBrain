id: megabrain-webhooks
name: MegaBrain Webhooks
description: Manage MegaBrain webhook subscriptions for usage alerts, spend thresholds, and provider incident notifications.
author: MegaBrain
url: https://getmegabrain.com/docs
category: observability
prerequisites:
  - MegaBrain account with admin access
content:
  - name: stdio (npx)
    prerequisites:
      - Node.js
      - MegaBrain admin API key
    content: |
      {
        "command": "npx",
        "args": ["-y", "@megabrain/mcp-webhooks"],
        "env": {
          "MEGABRAIN_ADMIN_API_KEY": "{{MEGABRAIN_ADMIN_API_KEY}}"
        }
      }
parameters:
  - name: MegaBrain Admin API Key
    key: MEGABRAIN_ADMIN_API_KEY
    placeholder: mb_admin_xxxxxxxxxxxxxxxxxxxxxxxx
